global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'advancepay-production'
    env: 'production'

rule_files:
  - "alerting-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # AdvancePay API Metrics
  - job_name: 'advancepay-api'
    static_configs:
      - targets: ['api:8080']
        labels:
          service: 'payment-gateway'
          component: 'api'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # PostgreSQL Metrics (requires postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'database'
          component: 'postgres'
    scrape_interval: 15s

  # Redis Metrics (requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'
          component: 'redis'
    scrape_interval: 15s

  # Kafka Metrics (requires jmx_exporter)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9308']
        labels:
          service: 'messaging'
          component: 'kafka'
    scrape_interval: 15s

  # Node Exporter for System Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'infrastructure'
          component: 'system'
    scrape_interval: 15s

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
